<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VTT Club</title>
  <link rel="icon" href="commun/images/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="commun/theme.css">
  <style>
    .hero { text-align: center; padding: 40px 0 24px; }
    .hero h1 { font-size: 30px; margin: 0 0 8px; }
    .hero .btn { font-size: 17px; padding: 14px 28px; margin-top: 18px; }
    .cartes { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-top: 28px; }
    .cartes div { background: var(--card); border: 1px solid var(--line); border-radius: var(--rayon); padding: 14px; }
    .cartes h2 { font-size: 16px; margin: 0 0 6px; }
  </style>
  <script type="module" src="commun/entete.js"></script>
</head>
<body>
  <main class="page">
    <section class="hero">
      <h1>Bienvenue au VTT Club</h1>
      <p class="mut">Association de vététistes : sorties chaque week-end, tous niveaux.</p>
      <a class="btn p" href="sorties/">🚵 Sorties VTT : s'inscrire</a>
    </section>
    <section class="cartes">
      <div><h2>Le samedi</h2><p class="mut">Rendez-vous à 9 h (trois groupes de niveau) et à 14 h.</p></div>
      <div><h2>Le dimanche</h2><p class="mut">Sortie du matin à 9 h.</p></div>
      <div><h2>Et en semaine</h2><p class="mut">Chacun peut proposer une sortie dans l'appli.</p></div>
    </section>
  </main>
</body>
</html>
